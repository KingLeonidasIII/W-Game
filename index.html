<!DOCTYPE html>
<html>
<head>
    <title>Chrono Dash</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #111; 
            overflow: hidden;
        }
        canvas { 
            border: 2px solid #444; 
            background: #222; 
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: #0f0; 
            font-family: Arial, sans-serif;
        }
        #start { 
            position: absolute; 
            color: #0f0; 
            font-size: 24px; 
            cursor: pointer;
            text-shadow: 0 0 10px #0f0;
        }
        #over { 
            position: absolute; 
            color: #f00; 
            font-size: 32px; 
            display: none;
            cursor: pointer;
        }
        #controls { 
            position: absolute; 
            bottom: 10px; 
            color: #888; 
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span> | Time: <span id="time">100%</span> | Rewinds: <span id="rewinds">3</span></div>
    <div id="start" onclick="startGame()">CLICK TO START</div>
    <div id="over" onclick="startGame()">GAME OVER - Click to restart</div>
    <div id="controls">SPACE=Jump | SHIFT=Slow-Mo | R=Rewind | ESC=Pause</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <script>
        // ========== CANVAS SETUP ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ========== GAME CONSTANTS ==========
        const GRAVITY = 0.8;
        const JUMP_FORCE = -12;
        const PLAYER_WIDTH = 30;
        const PLAYER_HEIGHT = 50;
        const GROUND_Y = 340;
        const BASE_SPEED = 5;
        const SLOW_MO_FACTOR = 0.4;
        const TIME_ENERGY_MAX = 100;
        const REWIND_DURATION = 2.5; // seconds
        const MAX_REWINDS = 3;
        const REWIND_COOLDOWN = 1000; // ms
        
        // ========== GAME STATE ==========
        let game = {
            running: false,
            paused: false,
            score: 0,
            highScore: localStorage.getItem('chronoDashHighScore') || 0,
            speed: BASE_SPEED,
            timeEnergy: TIME_ENERGY_MAX,
            rewindsLeft: MAX_REWINDS,
            lastRewindTime: 0,
            isSlowMo: false,
            isRewinding: false,
            rewindProgress: 0,
            gameOver: false,
            cameraOffset: 0
        };
        
        // ========== PLAYER ==========
        let player = {
            x: 100,
            y: GROUND_Y,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            velY: 0,
            isJumping: false,
            color: '#00ffff'
        };
        
        // ========== WORLD ==========
        let obstacles = [];
        let coins = [];
        let platforms = [];
        let particles = [];
        let stars = [];
        let rewindBuffer = [];
        
        // ========== INPUT ==========
        let keys = {};
        
        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
            keys[e.key] = true;
            
            // Debug: console.log('Key down:', e.code, e.key);
            
            // R key - rewind
            if ((e.code === 'KeyR' || e.key === 'r' || e.key === 'R') && 
                game.rewindsLeft > 0 && 
                game.running && 
                !game.isRewinding) {
                const now = Date.now();
                if (now - game.lastRewindTime > REWIND_COOLDOWN) {
                    startRewind();
                    game.lastRewindTime = now;
                }
            }
            
            // ESC - pause
            if (e.code === 'Escape' && game.running) {
                game.paused = !game.paused;
            }
        });
        
        window.addEventListener('keyup', function(e) {
            keys[e.code] = false;
            keys[e.key] = false;
            
            // Shift released - stop slow-mo
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.key === 'Shift') {
                game.isSlowMo = false;
            }
        });
        
        // Right click for slow-mo
        window.addEventListener('mousedown', function(e) {
            if (e.button === 2 && game.running) {
                e.preventDefault();
                game.isSlowMo = true;
            }
        });
        
        window.addEventListener('contextmenu', function(e) {
            if (game.running) e.preventDefault();
        });
        
        // ========== INITIALIZE STARS ==========
        function initStars() {
            stars = [];
            for (let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * 800,
                    y: Math.random() * 340,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }
        
        // ========== START GAME ==========
        function startGame() {
            // Reset player
            player.x = 100;
            player.y = GROUND_Y;
            player.velY = 0;
            player.isJumping = false;
            
            // Reset game state
            game.running = true;
            game.paused = false;
            game.score = 0;
            game.speed = BASE_SPEED;
            game.timeEnergy = TIME_ENERGY_MAX;
            game.rewindsLeft = MAX_REWINDS;
            game.isSlowMo = false;
            game.isRewinding = false;
            game.rewindProgress = 0;
            game.gameOver = false;
            game.cameraOffset = 0;
            
            // Clear world
            obstacles = [];
            coins = [];
            platforms = [];
            particles = [];
            rewindBuffer = [];
            
            // Hide screens
            document.getElementById('start').style.display = 'none';
            document.getElementById('over').style.display = 'none';
            
            // Initialize stars
            initStars();
            
            // Start game loop
            lastTime = performance.now();
            gameLoop();
        }
        
        // ========== GAME OVER ==========
        function gameOver() {
            game.gameOver = true;
            game.running = false;
            
            // Update high score
            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('chronoDashHighScore', game.highScore);
            }
            
            // Show game over
            document.getElementById('over').style.display = 'block';
        }
        
        // ========== START REWIND ==========
        function startRewind() {
            if (game.isRewinding || rewindBuffer.length === 0) return;
            
            game.isRewinding = true;
            game.rewindsLeft--;
            game.rewindProgress = 0;
            
            // Add particles
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 2,
                    life: 1,
                    color: '#ff00ff'
                });
            }
        }
        
        // ========== ADD PARTICLES ==========
        function addParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 2,
                    life: 1,
                    color: color
                });
            }
        }
        
        // ========== SPAWN OBSTACLES ==========
        function spawnObstacles() {
            if (Math.random() < 0.01) {
                const types = ['gap', 'spike', 'wall'];
                const type = types[Math.floor(Math.random() * types.length)];
                let obstacle;
                
                switch (type) {
                    case 'gap':
                        obstacle = {
                            x: 800 + game.cameraOffset,
                            y: GROUND_Y - 20,
                            width: 40 + Math.random() * 60,
                            height: 20,
                            type: 'gap',
                            color: '#1a1a2e'
                        };
                        break;
                    case 'spike':
                        obstacle = {
                            x: 800 + game.cameraOffset,
                            y: GROUND_Y - 30,
                            width: 30,
                            height: 30,
                            type: 'spike',
                            color: '#ff0000'
                        };
                        break;
                    case 'wall':
                        obstacle = {
                            x: 800 + game.cameraOffset,
                            y: GROUND_Y - 80,
                            width: 20,
                            height: 80,
                            type: 'wall',
                            color: '#444444'
                        };
                        break;
                }
                obstacles.push(obstacle);
            }
            
            // Spawn coins
            if (Math.random() < 0.005) {
                coins.push({
                    x: 800 + game.cameraOffset,
                    y: 200 + Math.random() * 100,
                    width: 20,
                    height: 20,
                    color: '#ffff00'
                });
            }
            
            // Spawn platforms
            if (Math.random() < 0.003) {
                platforms.push({
                    x: 800 + game.cameraOffset,
                    y: 200 + Math.random() * 100,
                    width: 60 + Math.random() * 40,
                    height: 15,
                    color: '#00ff00'
                });
            }
        }
        
        // ========== CHECK COLLISIONS ==========
        function checkCollisions() {
            // Check obstacles
            for (const obstacle of obstacles) {
                if (obstacle.type === 'gap') {
                    if (player.x + player.width > obstacle.x &&
                        player.x < obstacle.x + obstacle.width &&
                        player.y + player.height > obstacle.y &&
                        player.y + player.height < obstacle.y + obstacle.height) {
                        gameOver();
                        return;
                    }
                } else {
                    if (player.x + player.width > obstacle.x &&
                        player.x < obstacle.x + obstacle.width &&
                        player.y + player.height > obstacle.y &&
                        player.y < obstacle.y + obstacle.height) {
                        gameOver();
                        return;
                    }
                }
            }
            
            // Check coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                if (player.x + player.width > coin.x &&
                    player.x < coin.x + coin.width &&
                    player.y + player.height > coin.y &&
                    player.y < coin.y + coin.height) {
                    coins.splice(i, 1);
                    game.timeEnergy = Math.min(TIME_ENERGY_MAX, game.timeEnergy + 20);
                    game.score += 100;
                    addParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, 10, '#ffff00');
                }
            }
            
            // Check if player fell off screen
            if (player.y > 400) {
                gameOver();
            }
        }
        
        // ========== UPDATE GAME ==========
        function update(deltaTime) {
            if (!game.running || game.paused || game.gameOver) return;
            
            // Handle slow-mo from Shift
            if ((keys['ShiftLeft'] || keys['ShiftRight'] || keys['Shift']) && game.timeEnergy > 0) {
                game.isSlowMo = true;
            }
            
            const dt = game.isSlowMo ? SLOW_MO_FACTOR : 1;
            
            // Update player
            player.x += game.speed * dt;
            
            // Apply gravity
            player.velY += GRAVITY * dt;
            player.y += player.velY * dt;
            
            // Check for jump
            const isJumpPressed = keys[' '] || keys['Space'] || keys['ArrowUp'] || keys['Up'];
            const isOnGround = player.y >= GROUND_Y;
            let isOnPlatform = false;
            
            for (const platform of platforms) {
                if (player.y + player.height >= platform.y &&
                    player.y + player.height <= platform.y + platform.height &&
                    player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width) {
                    isOnPlatform = true;
                    break;
                }
            }
            
            if (isJumpPressed && (isOnGround || isOnPlatform) && !player.isJumping) {
                player.velY = JUMP_FORCE;
                player.isJumping = true;
                const groundLevel = isOnGround ? GROUND_Y : player.y + player.height + 5;
                addParticles(player.x + player.width / 2, groundLevel, 10, '#00ffff');
            }
            
            // Land on ground
            if (player.y >= GROUND_Y) {
                player.y = GROUND_Y;
                player.velY = 0;
                player.isJumping = false;
            }
            
            // Land on platforms
            for (const platform of platforms) {
                if (player.y + player.height >= platform.y &&
                    player.y + player.height <= platform.y + platform.height &&
                    player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width &&
                    player.velY > 0) {
                    player.y = platform.y - player.height;
                    player.velY = 0;
                    player.isJumping = false;
                }
            }
            
            // Camera follows player
            game.cameraOffset = player.x - 200;
            
            // Save position for rewind
            if (Math.random() < 0.1) {
                rewindBuffer.push({
                    x: player.x,
                    y: player.y,
                    velY: player.velY,
                    isJumping: player.isJumping,
                    score: game.score,
                    speed: game.speed,
                    cameraOffset: game.cameraOffset
                });
                if (rewindBuffer.length > 300) rewindBuffer.shift();
            }
            
            // Update rewind
            if (game.isRewinding) {
                game.rewindProgress += dt / REWIND_DURATION;
                if (game.rewindProgress >= 1) {
                    game.isRewinding = false;
                    if (rewindBuffer.length > 0) {
                        const state = rewindBuffer[0];
                        player.x = state.x;
                        player.y = state.y;
                        player.velY = state.velY;
                        player.isJumping = state.isJumping;
                        game.score = state.score;
                        game.speed = state.speed;
                        game.cameraOffset = state.cameraOffset;
                    }
                    addParticles(player.x + player.width / 2, player.y + player.height / 2, 20, '#ff00ff');
                } else {
                    const index = Math.floor((1 - game.rewindProgress) * rewindBuffer.length);
                    if (index >= 0 && index < rewindBuffer.length) {
                        const state = rewindBuffer[index];
                        player.x = state.x;
                        player.y = state.y;
                        player.velY = state.velY;
                        player.isJumping = state.isJumping;
                        game.score = state.score;
                        game.speed = state.speed;
                        game.cameraOffset = state.cameraOffset;
                    }
                }
            }
            
            // Update time energy
            if (game.isSlowMo) {
                game.timeEnergy -= 0.5 * dt;
                if (game.timeEnergy <= 0) {
                    game.timeEnergy = 0;
                    game.isSlowMo = false;
                }
            } else {
                game.timeEnergy = Math.min(TIME_ENERGY_MAX, game.timeEnergy + 0.2 * dt);
            }
            
            // Spawn obstacles
            spawnObstacles();
            
            // Move world objects
            for (const obj of obstacles) obj.x -= game.speed * dt;
            for (const obj of coins) obj.x -= game.speed * dt;
            for (const obj of platforms) obj.x -= game.speed * dt;
            for (const star of stars) {
                star.x -= star.speed * (game.isSlowMo ? SLOW_MO_FACTOR : 1);
                if (star.x < game.cameraOffset - 100) {
                    star.x = game.cameraOffset + 800 + 100;
                    star.y = Math.random() * 340;
                }
            }
            
            // Remove off-screen objects
            obstacles = obstacles.filter(o => o.x + o.width > game.cameraOffset - 100);
            coins = coins.filter(o => o.x + o.width > game.cameraOffset - 100);
            platforms = platforms.filter(o => o.x + o.width > game.cameraOffset - 100);
            
            // Check collisions
            checkCollisions();
            
            // Increase difficulty
            game.speed = BASE_SPEED + (game.score * SPEED_INCREASE);
            game.score += game.speed * 0.1 * dt;
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.05 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
        
        // ========== RENDER GAME ==========
        function render() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, 800, 400);
            
            // Draw background
            const gradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            gradient.addColorStop(0, '#0f0f23');
            gradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, GROUND_Y);
            
            // Draw stars
            ctx.fillStyle = '#ffffff';
            for (const star of stars) {
                ctx.beginPath();
                ctx.arc(star.x - game.cameraOffset, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw ground
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, GROUND_Y, 800, 60);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let x = -100; x < 800 + 100; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x - game.cameraOffset, 0);
                ctx.lineTo(x - game.cameraOffset, GROUND_Y);
                ctx.stroke();
            }
            
            // Draw platforms
            for (const platform of platforms) {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x - game.cameraOffset, platform.y, platform.width, platform.height);
                ctx.strokeStyle = '#00aa00';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x - game.cameraOffset, platform.y, platform.width, platform.height);
            }
            
            // Draw obstacles
            for (const obstacle of obstacles) {
                ctx.fillStyle = obstacle.color;
                if (obstacle.type === 'spike') {
                    ctx.beginPath();
                    ctx.moveTo(obstacle.x - game.cameraOffset, obstacle.y + obstacle.height);
                    ctx.lineTo(obstacle.x + obstacle.width / 2 - game.cameraOffset, obstacle.y);
                    ctx.lineTo(obstacle.x + obstacle.width - game.cameraOffset, obstacle.y + obstacle.height);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(obstacle.x - game.cameraOffset, obstacle.y, obstacle.width, obstacle.height);
                }
            }
            
            // Draw coins
            for (const coin of coins) {
                ctx.fillStyle = coin.color;
                ctx.beginPath();
                ctx.arc(coin.x + coin.width / 2 - game.cameraOffset, coin.y + coin.height / 2, coin.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(coin.x + coin.width / 2 - game.cameraOffset - 3, coin.y + coin.height / 2 - 3, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - game.cameraOffset, player.y, player.width, player.height);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x - game.cameraOffset, player.y, player.width, player.height);
            
            // Draw player face
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(player.x + 10 - game.cameraOffset, player.y + 10, 5, 5);
            ctx.fillRect(player.x + player.width - 15 - game.cameraOffset, player.y + 10, 5, 5);
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2 - game.cameraOffset, player.y + 25, 8, 0, Math.PI);
            ctx.stroke();
            
            // Draw particles
            for (const p of particles) {
                const alpha = p.life;
                ctx.fillStyle = p.color + alpha.toString();
                ctx.beginPath();
                ctx.arc(p.x - game.cameraOffset, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw effects
            if (game.isSlowMo) {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.fillRect(0, 0, 800, 400);
            }
            if (game.isRewinding) {
                ctx.fillStyle = `rgba(255, 0, 255, ${0.3 * (1 - game.rewindProgress)})`;
                ctx.fillRect(0, 0, 800, 400);
            }
            if (game.paused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, 800, 400);
                ctx.fillStyle = '#ffffff';
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', 400, 200);
            }
            
            // Update UI
            document.getElementById('score').textContent = Math.floor(game.score);
            document.getElementById('time').textContent = `${Math.floor(game.timeEnergy)}%`;
            document.getElementById('rewinds').textContent = game.rewindsLeft;
        }
        
        // ========== GAME LOOP ==========
        let lastTime = 0;
        function gameLoop(currentTime = 0) {
            const deltaTime = Math.min((currentTime - lastTime) / 16.67, 3);
            lastTime = currentTime;
            
            if (game.running) {
                update(deltaTime);
            }
            render();
            
            if (game.running || !game.gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        // Initialize
        document.getElementById('start').style.display = 'block';
        initStars();
        
        // Start with start screen
        render();
    </script>
</body>
</html>
